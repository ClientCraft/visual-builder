name: Feature request
description: Suggest something the Visual Builder should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or the problem, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would you like it to work?
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Your site setup, how often this comes up, screenshots or examples from other tools.
